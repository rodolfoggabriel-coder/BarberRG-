services:
  - type: web
    name: barberdesk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: barberdesk-db
          property: connectionURI
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: barberdesk-db
    plan: free
