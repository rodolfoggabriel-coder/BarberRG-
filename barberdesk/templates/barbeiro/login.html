{% extends "components/base.html" %}
{% block title %}Login Barbeiro - BarberDesk{% endblock %}
{% block body_class %}bg-dark{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-10 col-md-4">
        <div class="card shadow border-0 bg-dark text-white border-secondary">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-scissors display-3 text-primary"></i>
                    <h3 class="mt-2">BarberDesk</h3>
                    <p class="text-muted">Area do Barbeiro</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-light">Telefone</label>
                        <input type="tel" name="telefone" class="form-control form-control-lg bg-dark text-white border-secondary" required autofocus placeholder="(11) 99999-9999">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-light">PIN (4 digitos)</label>
                        <input type="password" name="pin" class="form-control form-control-lg bg-dark text-white border-secondary text-center" required maxlength="4" pattern="\d{4}" inputmode="numeric" style="letter-spacing: 1em; font-size: 2em;">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fs-5">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block footer %}{% endblock %}
