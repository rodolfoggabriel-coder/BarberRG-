{% extends "components/base.html" %}
{% block title %}Login - BarberDesk{% endblock %}
{% block body_class %}bg-dark{% endblock %}
{% block navbar %}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-4">
        <div class="card shadow border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-scissors display-3 text-primary"></i>
                    <h2 class="mt-2">BarberDesk</h2>
                    <p class="text-muted">Painel do Dono</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('admin.setup', step=1) }}" class="text-decoration-none small">
                        Criar minha barbearia
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block footer %}{% endblock %}
